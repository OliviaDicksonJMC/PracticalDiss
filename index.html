<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P3471 Work Space</title> 
<style>
  body {
    background-color: ##b3e0ff; /* Side margins-adjust as needed */
    margin: 0;
    font-family: sans-serif;
  }

  .top-bar {
    width: 100%;
    background-color: #0099ff ; /* Adjsut as needed */
    color: #ffffff;            /* White background */
    padding: 50px;
    box-sizing: border-box;
    text-align: center;
  }

  .top-bar h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 500;
  }

  .main-content {
    background-color: #ffffff; /* White background  */
    margin: 0 250px;           /* 250px side margins inlight green */
    min-height: calc(100vh - 70px);
    padding: 30px;
    box-sizing: border-box;
  }

  @media (max-width: 900px) {
    .main-content {
      margin: 0 20px; /* This adjusts side margins on smaller screens */
    }
  }
</style>

</head>
<body>

  <!-- Div tag is used to create the top bar -->
  <div class="top-bar">
    <h1> Dissertation Work Space | Liv Dickson</h1>
  </div>
  <div class="main-content">
    <p>This Dissertation will work on 3 main pieces all which focus on Scottish Independence!</p>
  </div>

</body>
</html>
